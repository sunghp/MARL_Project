<title>The Thing 리플레이</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --border: #dedad0;
  --text: #1e1d1a; --muted: #6b675e; --accent: #2f5fd0;
  --crew: #2f6fe0; --captain: #c48a00; --sab: #d1372e; --neutral: #8a867c; --dead: #b9b5ab;
  --good: #1f8a4c; --warn: #d1372e; --room: #f1efe9; --room-line: #cfcabe; --map: #fbfaf7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #262931; --border: #343843;
    --text: #ebe9e4; --muted: #9c9a93; --accent: #7aa2ff;
    --crew: #5b93ff; --captain: #e6b13a; --sab: #ff6157; --neutral: #8e8c86; --dead: #555963;
    --good: #4cc27f; --warn: #ff6157; --room: #262931; --room-line: #3d414c; --map: #1a1c21;
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #262931; --border: #343843;
  --text: #ebe9e4; --muted: #9c9a93; --accent: #7aa2ff;
  --crew: #5b93ff; --captain: #e6b13a; --sab: #ff6157; --neutral: #8e8c86; --dead: #555963;
  --good: #4cc27f; --warn: #ff6157; --room: #262931; --room-line: #3d414c; --map: #1a1c21;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.insights { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.insight b { display: block; font-size: 15px; margin-bottom: 4px; }
.insight .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0 4px; }
.insight p { margin: 0; color: var(--muted); font-size: 13.5px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 600; }
tr.sel td { background: var(--surface-2); }
.controls-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 12px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 6px 10px; border-radius: 8px; font: inherit; font-size: 13.5px; cursor: pointer; }
.seg button.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
.mapcard { padding: 10px; }
canvas { display: block; width: 100%; border-radius: 8px; background: var(--map); touch-action: manipulation; }
.hud { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13.5px; margin: 0 2px 8px; font-variant-numeric: tabular-nums; }
.hud .pill { padding: 2px 8px; border-radius: 999px; background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1 1 140px; min-width: 120px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
.player { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.player button.icon { width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; cursor: pointer; }
.player input[type=range] { flex: 1 1 200px; accent-color: var(--accent); }
.player .time { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted); min-width: 92px; text-align: right; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.endbox { font-size: 14px; }
.endbox .win { font-weight: 700; }
.roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 13px; margin-top: 8px; }
.roster span { display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.log { position: relative; list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; font-size: 13px; }
.log li { padding: 5px 6px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 6px; color: var(--muted); }
.log li.past { color: var(--text); }
.log li.now { background: var(--surface-2); }
.log li .t { font-variant-numeric: tabular-nums; color: var(--muted); }
.log .k-sab { color: var(--sab); font-weight: 600; }
.log .k-rep { color: var(--good); font-weight: 600; }
.log .k-shot { color: var(--captain); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 16px; }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .insights { grid-template-columns: minmax(0, 1fr); }
  .log { max-height: 300px; }
}
</style>

<div class="wrap">
  <h1>The Thing: 학습된 NPC 리플레이</h1>
  <p class="sub" id="sub"></p>

  <div class="insights" id="insights"></div>

  <div class="card">
    <h2>조합별 100판 통계</h2>
    <div class="tablewrap"><table id="stats"></table></div>
  </div>

  <div class="controls-top">
    <div class="seg" id="polSeg"></div>
    <div class="seg" id="gameSeg"></div>
  </div>

  <div class="main">
    <div class="card mapcard">
      <div class="hud">
        <span class="pill" id="hudAlive"></span>
        <span>함선 진행</span><div class="bar"><i id="shipBar"></i></div><span id="shipPct"></span>
      </div>
      <canvas id="map" aria-label="게임 지도"></canvas>
      <div class="player">
        <button class="icon" id="playBtn" title="재생/정지 (Space)">▶</button>
        <button class="icon" id="restartBtn" title="처음부터">⟲</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="시간">
        <span class="time" id="timeLbl"></span>
      </div>
      <div class="player">
        <div class="seg" id="speedSeg"></div>
        <label class="chk"><input type="checkbox" id="reveal" checked> 역할 공개</label>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--crew)"></i>선원</span>
        <span><i class="dot" style="background:var(--captain)"></i>함장</span>
        <span><i class="dot" style="background:var(--sab)"></i>사보타주</span>
        <span>빨간 고리 = 부수는 중 · 초록 고리 = 수리 중</span>
        <span>방 테두리 빨강 = 알림(안정도 70% 미만)</span>
        <span>노란 선 = 함장 사격</span>
      </div>
    </div>

    <div class="side">
      <div class="card endbox" id="endbox"></div>
      <div class="card">
        <h2>사건 기록</h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
const D = /*__DATA__*/null;

const KO = { NavigationRoom: "항해실", ElectronicRoom: "전기실", CommunityRoom: "휴게실", OxygenRoom: "산소실",
  Storage: "창고", ProtectorRoom: "방어실", EngineRoom: "엔진실", NeclearReactor: "원자로" };
const POL = [["trained", "전원 학습"], ["sab_only", "사보타주만 학습"], ["random", "전원 무작위"]];
const POL_LONG = { trained: "모두 학습 정책", sab_only: "사보타주 학습 · 인간팀 무작위", random: "모두 무작위 행동" };
const ROLE_KO = { crew: "선원", captain: "함장", saboteur: "사보타주" };
const SPEEDS = [1, 2, 4, 8, 16];
const rooms = D.map.rooms.map(r => ({ ...r, ko: KO[r.name] || r.name }));
const koReason = s => s.replace(/[A-Za-z]+/g, m => KO[m] || m);

const S = { pol: "trained", gi: 0, t: 0, playing: false, speed: 4, reveal: true };
let G = null, events = [], endT = 1;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pct = x => (x * 100).toFixed(0) + "%";
const fmt = (x, d = 1) => x == null ? "–" : Number(x).toFixed(d);

// ---------- 상단: 요약 ----------
function header() {
  const ck = D.checkpoint, n = D.policies.trained.summary.games;
  document.getElementById("sub").textContent =
    `${ck.file} (${(ck.total_steps / 1e6).toFixed(2)}M 스텝 학습) 정책을 파이썬 시뮬레이터에서 돌린 결과. ` +
    `조합마다 ${n}판을 돌려 통계를 내고, 그중 4판을 재생할 수 있게 저장했다.`;

  const tr = D.policies.trained.summary, so = D.policies.sab_only.summary, rd = D.policies.random.summary;
  const cards = [
    ["사보타주는 배웠다", `부수기 ${fmt(rd.sabotage)} → ${fmt(tr.sabotage)}회/판`,
      `무작위일 때 인간팀이 ${pct(rd.crew_win)} 이기던 게임을, 학습된 사보타주는 ${pct(1 - tr.crew_win)} 가져온다. 주로 한 방을 집중해서 부숴 '완전 파괴'로 이긴다.`],
    ["인간팀 정책은 무작위와 비슷", `인간팀 승률 ${pct(tr.crew_win)} vs ${pct(so.crew_win)}`,
      `같은 학습 사보타주를 상대로, 학습한 인간팀(${pct(tr.crew_win)})과 무작위 인간팀(${pct(so.crew_win)})의 차이가 오차 범위 안이다. 수리·끊기·사격은 대부분 규칙(자동 수리, 근거 사격)이 해 준다.`],
    ["함장 사격은 정확하지만 드물다", `명중 ${pct(tr.shot_hit || 0)} · ${fmt(tr.shots, 2)}발/판`,
      `직접 보거나 신고받은 대상만 쏠 수 있어서 오사는 거의 없다. 대신 근거가 생기기 전에 방이 무너지는 판이 많다.`],
  ];
  document.getElementById("insights").innerHTML = cards.map(([b, big, p]) =>
    `<div class="card insight"><b>${b}</b><div class="big">${big}</div><p>${p}</p></div>`).join("");
  statsTable();
  document.getElementById("note").textContent =
    "Unity가 아니라, Unity C# 규칙을 그대로 옮긴 파이썬 시뮬레이터다. NavMesh 대신 직선으로 이동하고, 결정은 0.4초마다 내린다. " +
    "행동은 학습 때와 같은 확률적 샘플링이고, 게임마다 학습 루프와 같은 방식으로 리셋했다. 무작위 = 매 결정마다 이동·상호작용을 균등하게 고름.";
}

function statsTable() {
  const rows = [
    ["인간팀 승률", s => pct(s.crew_win)],
    ["게임 길이(초)", s => fmt(s.duration)],
    ["부수기 / 판", s => fmt(s.sabotage)],
    ["수리 / 판", s => fmt(s.repair)],
    ["수리로 끊기 / 판", s => fmt(s.interrupt, 2)],
    ["목격 / 판", s => fmt(s.witness, 2)],
    ["함장 사격 / 판", s => fmt(s.shots, 2)],
    ["사격 명중률", s => s.shot_hit == null ? "–" : pct(s.shot_hit)],
    ["끝: 목적지 도착", s => s.reasons["목적지 도착"] || 0],
    ["끝: 방 완전 파괴", s => s.reasons["방 완전 파괴"] || 0],
    ["끝: 사보타주 전원 제거", s => s.reasons["모든 사보타주 제거"] || 0],
    ["끝: 인간과 동수", s => s.reasons["인간과 동수"] || 0],
  ];
  const head = `<thead><tr><th></th>${POL.map(([k]) => `<th>${POL_LONG[k]}</th>`).join("")}</tr></thead>`;
  const body = rows.map(([name, f]) =>
    `<tr><td>${name}</td>${POL.map(([k]) => `<td>${f(D.policies[k].summary)}</td>`).join("")}</tr>`).join("");
  document.getElementById("stats").innerHTML = head + `<tbody>${body}</tbody>`;
}

// ---------- 선택 ----------
function segButtons(el, items, cur, onPick) {
  el.innerHTML = "";
  items.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if (key === cur) b.className = "on";
    b.onclick = () => onPick(key);
    el.appendChild(b);
  });
}
function renderSelectors() {
  segButtons(document.getElementById("polSeg"), POL, S.pol, k => { S.pol = k; S.gi = 0; loadGame(); });
  const reps = D.policies[S.pol].replays;
  segButtons(document.getElementById("gameSeg"),
    reps.map((g, i) => [i, `${i + 1}판 · ${g.end.winner === "crew" ? "인간 승" : "사보타주 승"}`]), S.gi,
    k => { S.gi = k; loadGame(); });
  segButtons(document.getElementById("speedSeg"), SPEEDS.map(s => [s, s + "×"]), S.speed,
    k => { S.speed = k; renderSelectors(); });
}

const who = i => {
  const r = G.roles[i];
  return S.reveal ? `NPC${i + 1}(${ROLE_KO[r]})` : (r === "captain" ? `NPC${i + 1}(함장)` : `NPC${i + 1}`);
};
function describe(e) {
  const rn = i => rooms[i].ko;
  switch (e.kind) {
    case "sabotage": return [`<span class="k-sab">부수기</span> ${who(e.who)} → ${rn(e.room)} ${fmt(e.health, 0)}%${e.hidden ? " · 아무도 못 봄" : " · 누군가 봄"}`];
    case "repair": return [`<span class="k-rep">수리</span> ${who(e.who)} → ${rn(e.room)} ${fmt(e.health, 0)}%`];
    case "interrupt": return [`<span class="k-rep">끊기</span> ${who(e.who)}가 ${who(e.victim)}의 부수기를 막음 (${rn(e.room)})`];
    case "witness": return [`목격 ${who(e.who)}가 ${who(e.suspect)}의 부수기를 봄`];
    case "report": return [`근거 확보 함장이 ${who(e.suspect)}를 직접 보거나 신고받음`];
    case "shot": return [`<span class="k-shot">사격</span> ${who(e.who)} → ${who(e.target)} · ${e.hit ? "사보타주 맞춤" : "선원 오사"}`];
  }
  return [e.kind];
}

function loadGame() {
  G = D.policies[S.pol].replays[S.gi];
  endT = G.end.t;
  events = G.events.slice().sort((a, b) => a.t - b.t);
  S.t = 0;
  renderSelectors();
  renderLog();
  renderEnd();
  setPlaying(true);
  draw();
}

function renderLog() {
  const ul = document.getElementById("log");
  ul.innerHTML = "";
  events.forEach((e, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="t">${fmt(e.t)}s</span><span>${describe(e)[0]}</span>`;
    li.onclick = () => { S.t = e.t; setPlaying(false); draw(); };
    ul.appendChild(li);
  });
  const li = document.createElement("li");
  li.innerHTML = `<span class="t">${fmt(endT)}s</span><span><b>게임 종료</b> · ${koReason(G.end.reason)}</span>`;
  li.onclick = () => { S.t = endT; setPlaying(false); draw(); };
  ul.appendChild(li);
}
function renderEnd() {
  const won = G.end.winner === "crew";
  const roster = G.roles.map((r, i) => {
    const col = r === "crew" ? "--crew" : r === "captain" ? "--captain" : "--sab";
    return `<span><i class="dot" style="background:var(${col})"></i>NPC${i + 1} ${ROLE_KO[r]}</span>`;
  }).join("");
  document.getElementById("endbox").innerHTML =
    `<div><span class="win" style="color:var(${won ? "--crew" : "--sab"})">${won ? "인간팀 승리" : "사보타주 승리"}</span>` +
    ` · ${koReason(G.end.reason)} · ${fmt(endT)}초</div>` +
    `<div style="color:var(--muted);font-size:13px">${POL_LONG[S.pol]}</div><div class="roster">${roster}</div>`;
}
function updateLog() {
  const items = document.getElementById("log").children;
  let last = -1;
  for (let i = 0; i < items.length; i++) {
    const t = i < events.length ? events[i].t : endT;
    const past = t <= S.t + 1e-6;
    items[i].classList.toggle("past", past);
    if (past) last = i;
  }
  for (let i = 0; i < items.length; i++) items[i].classList.toggle("now", i === last);
  if (S.playing && last >= 0) {
    const ul = document.getElementById("log"), it = items[last];
    if (it.offsetTop < ul.scrollTop || it.offsetTop + it.offsetHeight > ul.scrollTop + ul.clientHeight)
      ul.scrollTop = it.offsetTop - ul.clientHeight / 2;
  }
}

// ---------- 지도 ----------
const cv = document.getElementById("map"), ctx = cv.getContext("2d");
let view = null;
function layout() {
  const xs = rooms.map(r => r.x).concat([D.map.cafe[0]]), zs = rooms.map(r => r.z).concat([D.map.cafe[1]]);
  const pad = 26, minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad, minZ = Math.min(...zs) - pad, maxZ = Math.max(...zs) + pad;
  const w = cv.clientWidth, maxH = Math.max(320, window.innerHeight * 0.72);
  const sc = Math.min(w / (maxX - minX), maxH / (maxZ - minZ));
  const h = Math.round((maxZ - minZ) * sc);
  const dpr = window.devicePixelRatio || 1;
  cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ox = (w - (maxX - minX) * sc) / 2;
  view = { sc, w, h, X: x => ox + (x - minX) * sc, Y: z => (maxZ - z) * sc };
  draw();
}

function frameAt(t) {
  const F = G.frames;
  let lo = 0, hi = F.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (F[m].t <= t) lo = m; else hi = m - 1; }
  const a = F[lo], b = F[Math.min(lo + 1, F.length - 1)];
  const u = b.t > a.t ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 0;
  return { a, b, u };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function draw() {
  if (!view || !G) return;
  const { X, Y, sc, w, h } = view;
  const C = { text: css("--text"), muted: css("--muted"), room: css("--room"), line: css("--room-line"), warn: css("--warn"),
    good: css("--good"), crew: css("--crew"), cap: css("--captain"), sab: css("--sab"), neu: css("--neutral"), dead: css("--dead"), map: css("--map") };
  ctx.clearRect(0, 0, w, h);
  const { a, b, u } = frameAt(S.t);
  const cur = u < 0.5 ? a : b;

  // 카페에서 각 방으로 가는 옅은 길
  const cx = X(D.map.cafe[0]), cz = Y(D.map.cafe[1]);
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.setLineDash([3, 5]);
  rooms.forEach(r => { ctx.beginPath(); ctx.moveTo(cx, cz); ctx.lineTo(X(r.x), Y(r.z)); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.fillStyle = C.muted; ctx.font = `${Math.max(10, Math.round(11 * Math.min(1.2, sc / 2.6)))}px system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.beginPath(); ctx.arc(cx, cz, 3, 0, 7); ctx.fill();
  ctx.fillText("카페", cx, cz + 12);

  // 방: 이름은 위, 안정도는 아래, 상자 안은 캐릭터 자리
  const half = Math.max(16, 11 * sc);
  const fs = Math.max(11, Math.min(14, 5 * sc));
  rooms.forEach((r, i) => {
    const [hp, alerted] = cur.r[i];
    const x = X(r.x), y = Y(r.z), hh = half * 0.8;
    roundRect(x - half, y - hh, half * 2, hh * 2, 8);
    ctx.fillStyle = C.room; ctx.fill();
    ctx.lineWidth = alerted ? 3 : 1.2; ctx.strokeStyle = alerted ? C.warn : C.line; ctx.stroke();
    ctx.fillStyle = C.text; ctx.font = `600 ${fs}px system-ui, sans-serif`;
    ctx.fillText(r.ko, x, y - hh - fs * 0.8);
    ctx.font = `${fs - 1}px system-ui, sans-serif`;
    const label = `${hp.toFixed(0)}%`, tw = ctx.measureText("100%").width;
    const bx = x - half, by = y + hh + 8, bw = Math.max(10, half * 2 - tw - 5);
    ctx.fillStyle = C.line; ctx.fillRect(bx, by - 2, bw, 4);
    ctx.fillStyle = hp >= 70 ? C.good : hp >= 35 ? C.cap : C.warn;
    ctx.fillRect(bx, by - 2, bw * Math.max(0, hp) / 100, 4);
    ctx.fillStyle = hp < 70 ? C.warn : C.muted;
    ctx.textAlign = "right"; ctx.fillText(label, x + half, by);
    ctx.textAlign = "center";
  });

  // 최근 사격 선
  events.forEach(e => {
    if (e.kind !== "shot" || e.t > S.t || S.t - e.t > 1.6) return;
    const fr = frameAt(e.t).a, s = fr.c[e.who], t = fr.c[e.target];
    ctx.globalAlpha = 1 - (S.t - e.t) / 1.6;
    ctx.strokeStyle = C.cap; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X(s[0]), Y(s[1])); ctx.lineTo(X(t[0]), Y(t[1])); ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // 캐릭터 (같은 자리에 겹치면 살짝 벌림)
  const R = Math.max(7, Math.min(11, 3 * sc));
  const pos = a.c.map((ca, i) => {
    const cb = b.c[i];
    return [ca[0] + (cb[0] - ca[0]) * u, ca[1] + (cb[1] - ca[1]) * u];
  });
  const off = pos.map(() => [0, 0]);
  for (let i = 0; i < pos.length; i++) for (let j = 0; j < i; j++) {
    const dx = (X(pos[i][0]) + off[i][0]) - (X(pos[j][0]) + off[j][0]), dy = (Y(pos[i][1]) + off[i][1]) - (Y(pos[j][1]) + off[j][1]);
    const d = Math.hypot(dx, dy);
    if (d < R * 2) { const k = (R * 2 - d) / 2 + 0.5, ux = d > 0.01 ? dx / d : 1, uy = d > 0.01 ? dy / d : 0;
      off[i][0] += ux * k; off[i][1] += uy * k; off[j][0] -= ux * k; off[j][1] -= uy * k; }
  }
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
  cur.c.forEach((c, i) => {
    const x = X(pos[i][0]) + off[i][0], y = Y(pos[i][1]) + off[i][1];
    const alive = c[2] === 1, st = c[3], role = G.roles[i];
    const col = !alive ? C.dead : !S.reveal && role !== "captain" ? C.neu
      : role === "crew" ? C.crew : role === "captain" ? C.cap : C.sab;
    if (alive && st) {
      ctx.beginPath(); ctx.arc(x, y, R + 4 + pulse * 2, 0, 7);
      ctx.strokeStyle = st === 1 ? C.sab : C.good; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = C.map; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = `700 ${Math.round(R * 1.1)}px system-ui, sans-serif`;
    ctx.fillText(alive ? String(i + 1) : "×", x, y + 0.5);
  });

  // HUD
  const p = a.p + (b.p - a.p) * u;
  document.getElementById("shipBar").style.width = (Math.min(1, p) * 100).toFixed(1) + "%";
  document.getElementById("shipPct").textContent = (Math.min(1, p) * 100).toFixed(0) + "%";
  let crew = 0, sab = 0;
  cur.c.forEach((c, i) => { if (c[2]) { if (G.roles[i] === "saboteur") sab++; else crew++; } });
  document.getElementById("hudAlive").textContent = `생존 인간팀 ${crew} · 사보타주 ${sab}`;
  document.getElementById("timeLbl").textContent = `${S.t.toFixed(1)} / ${endT.toFixed(1)}초`;
  document.getElementById("scrub").value = Math.round(S.t / endT * 1000);
  updateLog();
}

// ---------- 재생 ----------
function setPlaying(on) {
  S.playing = on;
  document.getElementById("playBtn").textContent = on ? "❚❚" : "▶";
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing) {
    S.t = Math.min(endT, S.t + dt * S.speed);
    if (S.t >= endT) setPlaying(false);
  }
  draw();
  requestAnimationFrame(tick);
}

document.getElementById("playBtn").onclick = () => { if (S.t >= endT) S.t = 0; setPlaying(!S.playing); };
document.getElementById("restartBtn").onclick = () => { S.t = 0; setPlaying(true); };
document.getElementById("scrub").oninput = e => { S.t = e.target.value / 1000 * endT; setPlaying(false); draw(); };
document.getElementById("reveal").onchange = e => { S.reveal = e.target.checked; renderLog(); draw(); };
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); document.getElementById("playBtn").click(); }
});
window.addEventListener("resize", layout);

header();
loadGame();
layout();
requestAnimationFrame(tick);
</script>
